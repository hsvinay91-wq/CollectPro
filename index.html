function weekdayName(n){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][Number(n)];}
function weekdayShort(n){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][Number(n)];}
function nextWeekDate(loanDate,weekNo,weekday){
  if(!loanDate || !weekNo) return "";
  var p=String(loanDate).split("-").map(Number);
  if(p.length!==3 || !p[0] || !p[1] || !p[2]) return "";
  var d=new Date(p[0],p[1]-1,p[2]);
  var target=Number(weekday);
  if(!Number.isInteger(target)||target<0||target>6) target=4;
  var delta=(target-d.getDay()+7)%7;
  if(delta===0) delta=7;
  d.setDate(d.getDate()+delta+((Number(weekNo)-1)*7));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function trackerItems(c){
 var base=[],i;
 for(i=1;i<=c.weeks;i++)base.push({week:i,status:"upcoming"});
 c.pays.forEach(function(p){
   if(p.week>=1&&p.week<=c.weeks){
     if(p.type==="paid"||p.type==="hist")base[p.week-1].status="paid";
     else if(p.type==="unpaid"&&base[p.week-1].status!=="paid")base[p.week-1].status="unpaid";
   }
 });
 var debt=base.filter(function(x){return x.status==="unpaid"});
 debt.forEach(function(d,i){
   var cw=c.weeks+i+1;
   var cp=c.pays.filter(function(p){return +p.week===cw});
   var paid=cp.some(function(p){return p.type==="paid"||p.type==="hist"});
   base.push({week:cw,status:paid?"paid":"carry"});
 });
 return base;
}

 if(!view){
  var T=DB.reduce(function(t,c){var k=calc(c);t.paid+=k.paid;t.pend+=k.pend;t.pw+=k.pendW;return t},{paid:0,pend:0,pw:0});
  a.innerHTML='<div class="grid">'+[["Total customers",DB.length,"Active collection accounts"],["Total collected",inr(T.paid),"Recorded payments"],["Total pending",inr(T.pend),"Outstanding amount"],["Pending weeks",T.pw,"Across all customers"]].map(function(s){return '<div class="stat"><div class="l">'+s[0]+'</div><div class="v">'+s[1]+'</div><div class="s">'+s[2]+'</div></div>'}).join("")+'</div>'+
  '<div class="sec"><h2>Customers ('+DB.length+')</h2><p>Tap a customer to open their collection account.</p><input id="srch" placeholder="Search by name or phone" value="'+esc(q)+'" oninput="q=this.value.toLowerCase();list()"><div class="row" id="chips" style="margin:12px 0 6px"></div><div id="lst"></div></div>'+
  '<div class="row" style="margin-top:14px"><button class="btn sm" onclick="backup()">Backup &amp; restore</button><button class="btn sm" id="installBtn" style="display:none" onclick="installApp()">Install App</button></div>';
  chips();list();return;
 }
 var c=DB.filter(function(x){return x.id===view})[0];if(!c){go("");return}
 var k=calc(c),st=strip(c);
 var asc=c.pays.map(function(p,i){return{p:p,i:i}}).sort(function(x,y){return x.p.date<y.p.date?-1:x.p.date>y.p.date?1:x.i-y.i});
 var bal=k.payable-k.hAmt,B={};asc.forEach(function(o){if(o.p.type==="paid")bal-=(+o.p.amt||0);B[o.p.id]=Math.max(bal,0)});
 var ps=asc.map(function(o){return o.p}).reverse(),R='style="color:var(--miss)"';
 a.innerHTML='<div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="go(\'\')">← All customers</button></div>'+
 '<div class="hero"><div class="row"><div><h1>'+esc(c.name)+'</h1><small>'+esc(c.phone||"No contact")+' · Loan taken '+fmt(c.date)+'</small></div><span class="badge sp'+(k.done?' o':'')+'">'+(k.done?"Completed":"Active")+'</span></div>'+
 '<div class="big"><div><div class="n g">'+inr(k.pend)+'</div><div class="l">Pending balance</div></div><div><div class="n">'+inr(k.paid)+'</div><div class="l">Collected so far</div></div></div>'+
 '<div class="l" style="margin-top:12px;font-size:12.5px;color:#B9B6C8">'+inr(k.payable)+' total payable − '+inr(k.paid)+' paid = '+inr(k.pend)+'</div>'+
 '<div class="bar"><b style="width:'+k.pct+'%"></b></div><div class="row" style="margin-top:8px;font-size:13px;color:#C9C6D6"><span>'+k.paidW+' of '+c.weeks+' weeks paid</span><span class="sp">'+k.pct+'%</span></div></div>'+
 '<div class="row" style="margin-top:14px"><button class="btn pri" onclick="payForm(\''+c.id+'\')">+ Add payment</button><button class="btn" onclick="custForm(\''+c.id+'\')">Edit customer</button>'+(c.phone?'<a class="btn" href="tel:'+esc(c.phone)+'">Call</a><a class="btn" target="_blank" rel="noopener" href="'+wa(c,k)+'">WhatsApp reminder</a>':'')+'<button class="btn del sp" onclick="delC(\''+c.id+'\',this)">Delete customer</button></div>'+
 '<div class="grid">'+[["Loan amount",inr(c.loan),"Original principal"],["Total payable",inr(k.payable),inr(c.perWeek)+" × "+c.weeks+" weeks"],["Missed weeks",k.miss,inr(k.miss*c.perWeek)+" overdue"],["Weeks remaining",k.pendW,"Until account closes"]].map(function(s,i){return '<div class="stat"><div class="l">'+s[0]+'</div><div class="v"'+(i===2&&k.miss?' '+R:'')+'>'+s[1]+'</div><div class="s">'+s[2]+'</div></div>'}).join("")+'</div>'+
 '<div class="sec"><h2>Week-by-week tracker</h2><p>Green = paid. Orange = missed or carried over beyond the original payable weeks.</p><div class="strip">'+st.map(function(x,i){return '<div class="w '+x+'">'+(i+1)+'</div>'}).join("")+'</div><div class="leg"><span style="--c:var(--paid)">Paid</span><span style="--c:var(--miss)">Unpaid</span><span style="--c:var(--pend)">Upcoming</span></div></div>'+

 paymentHistoryHtml(c,true)+((+c.hPaid||0)?'<div class="note" style="margin-top:14px">Includes '+c.hPaid+' historical paid weeks from setup ('+inr(k.hAmt)+'). Use Edit customer to change them.</div>':'');

function paymentRows(c){
  return c.pays.map(function(p,i){return {p:p,i:i}}).sort(function(a,b){
    var d=String(b.p.date||"").localeCompare(String(a.p.date||""));
    return d!==0?d:b.i-a.i;
  }).map(function(x){return x.p});
}
function paymentDay(s){
  if(!s)return "";
  var d=new Date(s+"T00:00:00");
  return Number.isNaN(d.getTime())?"":d.toLocaleDateString("en-IN",{weekday:"short"});
}
function paymentRowHtml(c,p,adminMode){
  var u=p.type==="unpaid";
  var status=u?"Unpaid":(p.type==="hist"?"Historical":"Paid");
  var statusClass=u?"unpaid":"";
  var action=adminMode ? ' onclick="payForm(\''+c.id+'\',\''+(p.id||"")+'\')"' : '';
  return '<div class="ph-row"'+action+'>'+
    '<div class="ph-date">'+fmt(p.date)+'<small>'+paymentDay(p.date)+'</small></div>'+
    '<div class="ph-week">W'+esc(p.week)+'</div>'+
    '<div class="ph-status '+statusClass+'"><span class="ph-dot"></span>'+status+'</div>'+
    '<div class="ph-amount">'+(u?inr(0):inr(p.amt))+'</div>'+
    '<div class="ph-arrow">›</div>'+
  '</div>';
}
function paymentHistoryHtml(c,adminMode){
  var rows=paymentRows(c),recent=rows.slice(0,5);
  return '<div class="sec">'+
    '<div class="ph-head"><div><h2>Payment history</h2><p style="margin-bottom:0">'+(adminMode?"Recent collections. Tap a row to edit.":"Your recent collections.")+'</p></div>'+
    '<span class="ph-count">'+rows.length+' '+(rows.length===1?"entry":"entries")+'</span></div>'+
    (recent.length?'<div class="ph-list">'+recent.map(function(p){return paymentRowHtml(c,p,adminMode)}).join("")+'</div>':'<div class="ph-empty">No payment rows yet.</div>')+
    (rows.length>5?'<button class="ph-view" onclick="viewAllPayments(\''+c.id+'\','+(adminMode?'true':'false')+')">View all payments <span class="arr">›</span></button>':'')+
    '</div>';
}
function viewAllPayments(cid,adminMode){
  var c=DB.filter(function(x){return x.id===cid})[0]; if(!c)return;
  var rows=paymentRows(c);
  var body=rows.length?'<div class="ph-list">'+rows.map(function(p){return paymentRowHtml(c,p,adminMode)}).join("")+'</div>':'<div class="ph-empty">No payment rows yet.</div>';
  open_('<div class="row"><div><h2>All payments</h2><p style="color:var(--muted);font-size:13px;margin:4px 0 0">'+esc(c.name)+' · '+rows.length+' entries</p></div><button class="btn sm sp" onclick="close_()">Close</button></div><div style="margin-top:14px">'+body+'</div>');
}

function backup(){open_('<h2>Backup &amp; restore</h2><p style="color:var(--muted);font-size:13px;margin:6px 0 12px">Copy this text and keep it safe (Notes, WhatsApp to yourself). To move data to another device, paste it here and tap Restore. Restore replaces current data.</p><textarea id="bk" rows="7" onfocus="this.select()">'+esc(JSON.stringify(DB))+'</textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="close_()">Close</button><button class="btn pri sp" onclick="restore()">Restore from text</button></div><div id="err" style="color:var(--miss);margin-top:8px"></div>')}
function restore(){try{var d=JSON.parse($("bk").value);if(!Array.isArray(d)||d.some(function(c){return !c.id||!c.name||!Array.isArray(c.pays)}))throw 0;DB=d;save();close_();go("")}catch(e){$("err").textContent="This text is not a valid CollectPro backup."}}

function open_(h){$("modal").innerHTML=h;$("ov").classList.add("on")}
function close_(){$("ov").classList.remove("on")}
$("ov").addEventListener("mousedown",function(e){if(e.target===this)close_()});
function F(id,l,t,v,ex){return '<div><label>'+l+'<input id="'+id+'" type="'+(t||"text")+'" value="'+esc(v)+'" '+(ex||"")+'></label></div>'}


function selDay(id,label,v){
  var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  v=(v==null?4:+v);
  return '<div><label>'+label+'<select id="'+id+'">'+days.map(function(d,i){return '<option value="'+i+'"'+(i===v?' selected':'')+'>'+d+'</option>'}).join("")+'</select></label></div>';
}
function custForm(id){
 var c=id?DB.filter(function(x){return x.id===id})[0]:{name:"",customerId:"",phone:"",loan:"",perWeek:"",weeks:"",date:new Date().toISOString().slice(0,10),hPaid:0,hMiss:0,hAmt:""};
 open_('<h2>'+(id?"Edit customer":"Add customer / existing customer")+'</h2><div class="fg">'+
 F("f_name","Customer name","text",c.name)+F("f_cid","Customer ID","text",c.customerId||"")+F("f_pin","PIN","password","")+F("f_phone","Contact no","tel",c.phone)+
 F("f_loan","Loan amount (₹)","number",c.loan,'min="0"')+F("f_pw","Per week (₹)","number",c.perWeek,'min="1"')+
 F("f_wk","Total payable weeks","number",c.weeks,'min="1"')+F("f_date","Date loan taken","date",c.date)+
 '<div class="hd">Old customer? Enter what was already paid</div>'+
 F("f_hp","Historical paid weeks","number",c.hPaid,'min="0"')+F("f_hm","Historical missed weeks","number",c.hMiss,'min="0"')+
 '<div class="full">'+F("f_ha","Historical paid amount (optional)","number",c.hAmt,'min="0"')+'</div>'+
 '<div class="note full">Old weeks count toward completion without fake dates. Leave amount empty to use paid weeks × per week. Add dated old payments later from the customer page.</div></div>'+
 '<div class="row"><button class="btn" onclick="close_()">Cancel</button><button class="btn pri sp" onclick="saveC(\''+(id||"")+'\')">Save customer</button></div><div id="err" style="color:var(--miss);margin-top:8px"></div>');
}
async function saveC(id){
 var g=function(i){return $(i).value.trim()};
 var o={name:g("f_name"),customerId:g("f_cid"),phone:g("f_phone"),loan:+g("f_loan"),perWeek:+g("f_pw"),weeks:+g("f_wk"),date:g("f_date"),collectionWeekday:(id?((DB.filter(function(x){return x.id===id})[0].collectionWeekday==null)?4:+DB.filter(function(x){return x.id===id})[0].collectionWeekday):4),hPaid:+g("f_hp")||0,hMiss:+g("f_hm")||0,hAmt:g("f_ha")};
 var pin=g("f_pin");
 var e=!o.name?"Enter the customer name.":!o.customerId?"Enter a Customer ID.":(!id&&!pin)?"Set a PIN for this customer.":!(o.perWeek>0)?"Enter the per week amount.":!(o.weeks>0)?"Enter the total payable weeks.":(o.hPaid+o.hMiss>o.weeks)?"Paid + missed weeks cannot exceed total weeks.":"";
 if(e){$("err").textContent=e;return}
 if(id){var c=DB.filter(function(x){return x.id===id})[0];for(var k in o)c[k]=o[k];if(pin)c._newPin=pin}
 else{o.id=null;o.pays=[];o._newPin=pin;DB.push(o)}
 if(sb){var c2=id?DB.filter(function(x){return x.id===id})[0]:DB[DB.length-1];var ok=await cloudSaveCustomer(c2,pin||null);if(!ok)return;await cloudLoad();var match=DB.filter(function(x){return x.customerId.toLowerCase()===o.customerId.toLowerCase()})[0];if(match)id=match.id}
 save();close_();go(id||"");
}
function payForm(cid,pid){
 var c=DB.filter(function(x){return x.id===cid})[0],p=pid?c.pays.filter(function(x){return x.id===pid})[0]:null;
 var nx=c.pays.length?Math.max.apply(null,c.pays.map(function(x){return x.week}))+1:(+c.hPaid||0)+(+c.hMiss||0)+1;
 p=p||{date:nextWeekDate(c.date,Math.min(nx,c.weeks),c.collectionWeekday==null?4:+c.collectionWeekday)||new Date().toISOString().slice(0,10),amt:c.perWeek,mode:"Cash",week:Math.min(nx,c.weeks),type:"paid"};
 var sel=function(id,l,opts,v){return '<div><label>'+l+'<select id="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></label></div>'};
 open_('<h2>'+(pid?"Edit payment":"Add payment")+'</h2><div class="fg">'+
 F("p_date","Payment date","date",p.date)+F("p_amt","Amount paid (₹)","number",p.amt,'min="0"')+
 sel("p_mode","Payment mode",["Cash","UPI","Online","Bank Transfer"].map(function(m){return[m,m]}),p.mode)+F("p_wk","Week no.","number",p.week,'min="1" max="'+trackerItems(c).length+'"')+
 '<div class="full">'+sel("p_type","Payment type",[["paid","Paid week"],["unpaid","Unpaid (missed week)"],["hist","Historical paid week"]],p.type)+'</div>'+
 '<div class="note full">Unpaid weeks are saved as ₹0 and shown in red. Historical rows add dates to weeks already counted in setup, so they are not counted twice.</div></div>'+
 '<div class="row"><button class="btn" onclick="close_()">Cancel</button><button class="btn pri sp" onclick="saveP(\''+cid+'\',\''+(pid||"")+'\')">Save payment</button></div><div id="err" style="color:var(--miss);margin-top:8px"></div>');
 var tp=function(){var u=$("p_type").value==="unpaid";$("p_amt").disabled=u;if(u)$("p_amt").value=0;else if(+$("p_amt").value===0)$("p_amt").value=c.perWeek};$("p_type").onchange=tp;tp();
}
async function saveP(cid,pid){
 var c=DB.filter(function(x){return x.id===cid})[0];
 var o={date:$("p_date").value,amt:+$("p_amt").value,mode:$("p_mode").value,week:+$("p_wk").value,type:$("p_type").value};
 var maxWeek=trackerItems(c).length;if(!o.date||!(o.amt>=0)||!(o.week>=1&&o.week<=maxWeek)){$("err").textContent="Enter a date, amount and a week between 1 and "+maxWeek+".";return}
 if(pid){var p=c.pays.filter(function(x){return x.id===pid})[0];for(var k in o)p[k]=o[k]}else{o.id=uid();c.pays.push(o)}
 if(sb){var ok=await cloudSaveCustomer(c,null);if(!ok)return;await cloudLoad()}else save();close_();render();
}
function arm(key,b){if(armed===key)return true;armed=key;var t=b.textContent;b.textContent="Tap again";setTimeout(function(){if(armed===key){armed=null;b.textContent=t}},3000);return false}
async function delP(cid,pid,b){if(!arm(pid,b))return;var c=DB.filter(function(x){return x.id===cid})[0];c.pays=c.pays.filter(function(x){return x.id!==pid});if(sb){var ok=await cloudSaveCustomer(c,null);if(!ok)return;await cloudLoad()}else save();armed=null;render()}
async function delC(cid,b){if(!arm(cid,b))return;if(sb){var ok=await cloudDelete(cid);if(!ok)return}DB=DB.filter(function(x){return x.id!==cid});save();go("")}
var deferredInstallPrompt=null;

startApp();
