<style>
:root{--bg:#F5F3EE;--card:#fff;--ink:#14182E;--ink2:#1D2342;--text:#1A1E33;--muted:#6B7088;--line:#E4E1D8;--gold:#C9A45A;--paid:#2E9F7A;--miss:#D4604C;--pend:#D9D6CC;--onink:#F4EFE3;--in:#FAF9F5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1022;--card:#151A33;--ink:#1D2342;--ink2:#262D54;--text:#ECE8DC;--muted:#9096B0;--line:#262C4D;--pend:#2B3157;--in:#0F1428}}
:root[data-theme="dark"]{--bg:#0C1022;--card:#151A33;--ink:#1D2342;--ink2:#262D54;--text:#ECE8DC;--muted:#9096B0;--line:#262C4D;--pend:#2B3157;--in:#0F1428}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.brand{font:400 26px 'Instrument Serif',Georgia,serif;cursor:pointer}.brand i{color:var(--gold);font-style:normal}
.btn{font:600 13px Manrope,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1A1608}
.btn.del{color:var(--miss)}.btn.sm{padding:5px 10px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{margin-left:auto}
h1,h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
.stat,.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .l{font-size:12.5px;color:var(--muted)}.stat .v{font:400 28px/1.2 'Instrument Serif',serif;margin-top:4px}.stat .s{font-size:12px;color:var(--muted)}
.sec{margin-top:14px;padding:20px}.sec h2{font-size:22px;margin-bottom:4px}.sec p{margin:0 0 14px;color:var(--muted);font-size:13px}
.hero{background:linear-gradient(160deg,var(--ink2),var(--ink));color:var(--onink);border-radius:22px;padding:26px}
.hero h1{font-size:30px}.hero small{color:#B9B6C8}
.big{display:flex;flex-wrap:wrap;gap:24px 48px;margin-top:22px}
.big .n{font:400 clamp(36px,8vw,54px)/1 'Instrument Serif',serif}.big .n.g{color:var(--gold)}.big .l{font-size:12.5px;color:#B9B6C8}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden;margin-top:20px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E8CF92)}
.badge{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(46,159,122,.18);color:#6FE0B8;border:1px solid rgba(111,224,184,.4)}
.badge.o{background:rgba(201,164,90,.18);color:#E6C887;border-color:rgba(230,200,135,.4)}
.cust{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cust:last-child{border:0}.cust:hover{background:var(--in)}
.av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#1A1608;display:grid;place-items:center;font-weight:700;flex:none}
.cust .m{flex:1;min-width:0}.cust b{display:block}.cust small{color:var(--muted)}
.amt{text-align:right;font-weight:700}.amt small{display:block;font-weight:400}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}
.w{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--pend);color:var(--muted)}
.w.p{background:var(--paid);color:#fff}.w.m{background:var(--miss);color:#fff}
.leg{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.tw{width:100%;overflow:visible}table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-size:12px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
@media(max-width:560px){
 .sec{padding:14px}
 .tw table,.tw thead,.tw tbody,.tw tr,.tw th,.tw td{display:block;width:100%}
 .tw thead{display:none}
 .tw tr{background:var(--in);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:10px}
 .tw td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:10px;min-width:0}
 .tw td::before{font-size:11px;color:var(--muted);font-weight:600;flex:0 0 72px}
 .tw td:nth-child(1)::before{content:"Date"}.tw td:nth-child(2)::before{content:"Week"}.tw td:nth-child(3)::before{content:"Mode"}.tw td:nth-child(4)::before{content:"Status"}.tw td:nth-child(5)::before{content:"Amount"}.tw td:nth-child(6)::before{content:"Balance"}.tw td:nth-child(7)::before{content:"Actions"}
 .tw td:last-child{justify-content:flex-end;padding-top:8px}.tw td:last-child::before{display:none}
 .tw .btn.sm{padding:6px 9px}
}

/* Compact payment history */
.ph-list{display:grid;gap:0;margin-top:8px}
.ph-row{display:grid;grid-template-columns:minmax(88px,1.05fr) 56px minmax(78px,.9fr) minmax(74px,.8fr) 20px;align-items:center;gap:8px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ph-row:last-child{border-bottom:0}
.ph-date{font-weight:600;font-size:13px;line-height:1.25}
.ph-date small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.ph-week{justify-self:start;font-size:11.5px;font-weight:700;padding:6px 8px;border-radius:9px;background:var(--in);color:var(--text)}
.ph-status{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.ph-dot{width:9px;height:9px;border-radius:50%;background:var(--paid);box-shadow:0 0 0 3px rgba(46,159,122,.14);flex:none}
.ph-status.unpaid{color:var(--miss)}
.ph-status.unpaid .ph-dot{background:var(--miss);box-shadow:0 0 0 3px rgba(212,96,76,.14)}
.ph-amount{text-align:right;font-weight:700;font-size:14px}
.ph-arrow{text-align:right;color:var(--muted);font-size:20px}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.ph-count{font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:var(--in);white-space:nowrap}
.ph-view{width:100%;margin-top:12px;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(201,164,90,.16),rgba(201,164,90,.06));color:var(--gold);padding:11px 14px;border-radius:12px;font-weight:700;cursor:pointer}
.ph-view .arr{float:right;font-size:18px;line-height:14px}
.ph-empty{padding:20px 8px;text-align:center;color:var(--muted)}
@media(max-width:420px){
 .ph-row{grid-template-columns:minmax(82px,1.05fr) 48px minmax(68px,.85fr) minmax(62px,.7fr) 12px;gap:5px;padding:12px 2px}
 .ph-week{padding:5px 6px}.ph-status{font-size:11.5px}.ph-amount{font-size:13px}.ph-arrow{font-size:18px}
}

.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(201,164,90,.2)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(8,10,24,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 14px;z-index:9}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:520px;padding:22px;border:1px solid var(--line)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
@media(max-width:480px){.fg{grid-template-columns:1fr}}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--in);color:var(--text);font:500 14px Manrope,sans-serif}
.full{grid-column:1/-1}.note{font-size:12.5px;color:var(--muted);background:var(--in);border-radius:10px;padding:10px;margin-bottom:6px}
.hd{font-size:12px;font-weight:700;color:var(--gold);grid-column:1/-1;margin-top:4px}
a.btn{text-decoration:none;display:inline-block}
.chip{font:600 12.5px Manrope,sans-serif;border:1px solid var(--line);background:var(--in);color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1A1608}
.ring{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--gold) var(--p),var(--pend) 0);display:grid;place-items:center;flex:none}
.ring .av{width:40px;height:40px;border:3px solid var(--card)}

@media(max-width:560px){
 .modal{padding:16px}
 .modal .ph-row{grid-template-columns:minmax(72px,1fr) 42px minmax(64px,.9fr) 58px 10px;gap:5px}
 .modal .ph-date{font-size:12px}.modal .ph-status{font-size:11px}.modal .ph-amount{font-size:12px}
}

@media print{.btn{display:none}}


@media(max-width:560px){
 .ov{padding:12px 10px;align-items:flex-start;-webkit-overflow-scrolling:touch}
 .ov.on{display:flex}
 .modal{width:100%;max-height:calc(100dvh - 24px);overflow:auto;-webkit-overflow-scrolling:touch;padding:16px;border-radius:18px}
 .modal .ph-list{padding-bottom:4px}
}


.ph-view{transition:transform .16s ease,box-shadow .16s ease}
.ph-view:active{transform:scale(.98);box-shadow:0 6px 18px rgba(201,164,90,.18)}


/* CollectPro customer attraction animations */
.countup-ready{opacity:.98}
.portal-progress{overflow:hidden;position:relative}
.portal-progress:after{content:"";position:absolute;top:0;bottom:0;width:80px;left:-90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:goldSweep 2.8s ease-in-out infinite}
@keyframes goldSweep{0%{left:-90px}55%,100%{left:110%}}
.ph-row{transition:transform .18s ease,background .18s ease}
.ph-row:active{transform:scale(.985);background:rgba(201,164,90,.06)}
.portal-hero .n.g,.portal-hero .n:not(.g){font-variant-numeric:tabular-nums}
.completion-card{margin-top:14px;padding:14px 16px;border:1px solid rgba(201,164,90,.35);border-radius:16px;background:linear-gradient(135deg,rgba(201,164,90,.13),rgba(255,255,255,.03));display:flex;align-items:center;gap:12px;animation:completionIn .8s ease both}
.completion-icon{font-size:26px;animation:celebratePop 1.1s ease both}
@keyframes completionIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes celebratePop{0%{transform:scale(.4) rotate(-12deg);opacity:0}55%{transform:scale(1.18) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){.portal-progress:after{animation:none}.completion-card,.completion-icon{animation:none}.ph-row{transition:none}}


/* V20 more-visible premium customer animations */
.portal-page{perspective:1000px}
.portal-hero{animation:heroEntrance .9s cubic-bezier(.2,.8,.2,1) both}
.portal-hero:before{animation:heroOrb 4s ease-in-out infinite}
.portal-hero .portal-welcome{animation:welcomeSlide .7s .12s both}
.portal-hero .portal-name{animation:nameReveal .8s .18s both}
.portal-hero .portal-subtitle{animation:welcomeSlide .7s .26s both}
.portal-hero .portal-big>div:first-child{animation:moneyReveal .8s .32s both}
.portal-hero .portal-big>div:last-child{animation:moneyReveal .8s .42s both}
.portal-hero .portal-progress{animation:barReveal .9s .48s both}
.portal-stat{transition:transform .25s ease,box-shadow .25s ease}
.portal-stat:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.portal-section .w{animation:trackerBounce .55s cubic-bezier(.2,.8,.2,1) both!important}
.portal-section .w:nth-child(1){animation-delay:.35s!important}.portal-section .w:nth-child(2){animation-delay:.42s!important}.portal-section .w:nth-child(3){animation-delay:.49s!important}.portal-section .w:nth-child(4){animation-delay:.56s!important}.portal-section .w:nth-child(5){animation-delay:.63s!important}.portal-section .w:nth-child(6){animation-delay:.70s!important}.portal-section .w:nth-child(7){animation-delay:.77s!important}.portal-section .w:nth-child(8){animation-delay:.84s!important}.portal-section .w:nth-child(9){animation-delay:.91s!important}.portal-section .w:nth-child(10){animation-delay:.98s!important}.portal-section .w:nth-child(11){animation-delay:1.05s!important}.portal-section .w:nth-child(12){animation-delay:1.12s!important}
.portal-history{animation:historyReveal .75s 1.05s both}
.portal-lang{transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.portal-lang:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(201,164,90,.18)}
@keyframes heroEntrance{from{opacity:0;transform:translateY(24px) scale(.975)}to{opacity:1;transform:none}}
@keyframes welcomeSlide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes nameReveal{from{opacity:0;transform:translateY(16px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes moneyReveal{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes barReveal{from{opacity:0;transform:scaleX(.65);transform-origin:left}to{opacity:1;transform:scaleX(1)}}
@keyframes trackerBounce{0%{opacity:0;transform:translateY(12px) scale(.72)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes historyReveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes heroOrb{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-18px,12px,0) scale(1.08)}}
@media(prefers-reduced-motion:reduce){
 .portal-hero,.portal-hero .portal-welcome,.portal-hero .portal-name,.portal-hero .portal-subtitle,.portal-hero .portal-big>div,.portal-hero .portal-progress,.portal-section .w,.portal-history{animation:none!important}
}

/* Customer portal premium polish */
.portal-page{animation:portalFade .55s ease both}
.portal-hero{position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.18);animation:portalRise .65s ease both}
.portal-hero:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-110px;background:rgba(201,164,90,.14);filter:blur(8px);animation:glowFloat 5s ease-in-out infinite}
.portal-hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;left:-90px;bottom:-100px;background:rgba(90,126,210,.13);filter:blur(10px);animation:glowFloat 6s ease-in-out infinite reverse}
.portal-hero>*{position:relative;z-index:1}
.portal-welcome{font-size:14px;color:#D8D3C7;letter-spacing:.2px;margin-bottom:3px;animation:portalRise .7s .05s ease both}
.portal-name{font-size:32px!important;animation:portalRise .7s .12s ease both}
.portal-subtitle{font-size:13px;color:#B9B6C8;margin:6px 0 0;animation:portalRise .7s .18s ease both}
.portal-lang{border-color:rgba(255,255,255,.22)!important;background:rgba(255,255,255,.08)!important;color:#F5F0E5!important;backdrop-filter:blur(8px);font-weight:700}
.portal-big{animation:portalRise .7s .22s ease both}
.portal-stat{animation:portalRise .65s ease both}
.portal-stat:nth-child(2){animation-delay:.08s}.portal-stat:nth-child(3){animation-delay:.14s}.portal-stat:nth-child(4){animation-delay:.20s}

.portal-section .w:nth-child(2){animation-delay:.03s}.portal-section .w:nth-child(3){animation-delay:.06s}.portal-section .w:nth-child(4){animation-delay:.09s}.portal-section .w:nth-child(5){animation-delay:.12s}.portal-section .w:nth-child(6){animation-delay:.15s}.portal-section .w:nth-child(7){animation-delay:.18s}.portal-section .w:nth-child(8){animation-delay:.21s}.portal-section .w:nth-child(9){animation-delay:.24s}.portal-section .w:nth-child(10){animation-delay:.27s}.portal-section .w:nth-child(11){animation-delay:.30s}.portal-section .w:nth-child(12){animation-delay:.33s}.portal-section .w:nth-child(n+13){animation-delay:.36s}
.portal-history{animation:portalRise .65s .28s ease both}
.portal-progress b{transition:width 1.15s cubic-bezier(.2,.8,.2,1)}
@keyframes portalFade{from{opacity:0}to{opacity:1}}
@keyframes portalRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes weekPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes glowFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-12px,10px,0)}}
@media(prefers-reduced-motion:reduce){.portal-page,.portal-hero,.portal-welcome,.portal-name,.portal-subtitle,.portal-big,.portal-stat,.portal-section,.portal-history,.portal-section .w{animation:none!important}.portal-progress b{transition:none}}
@media(max-width:560px){.portal-name{font-size:29px!important}.portal-hero{padding:22px!important}.portal-lang{padding:7px 10px!important;font-size:11px!important}}

/* V21 Premium Fintech Design — visual only */
:root{--bg:#060A1B;--card:#111936;--ink:#0B1230;--ink2:#18244B;--text:#F4F6FF;--muted:#9AA6C7;--line:rgba(112,145,220,.24);--gold:#D7A83F;--paid:#19D6A0;--miss:#FF9A3D;--pend:#344064;--in:rgba(255,255,255,.045);--onink:#F5F7FF}
body{min-height:100vh;background:radial-gradient(circle at 8% 12%,rgba(61,94,190,.18),transparent 27%),radial-gradient(circle at 88% 22%,rgba(211,168,63,.10),transparent 25%),linear-gradient(145deg,#050918 0%,#090F27 48%,#0A1030 100%);overflow-x:hidden}

body:before{content:"₹";right:-4vw;top:12vh;font-size:clamp(180px,28vw,420px);color:rgba(215,168,63,.035);text-shadow:0 0 70px rgba(215,168,63,.08);transform:rotate(-9deg)}
body:after{content:"↗";left:-2vw;bottom:5vh;font-size:clamp(160px,24vw,340px);color:rgba(90,137,255,.045);transform:rotate(-8deg)}
.wrap{position:relative;z-index:1;max-width:1120px;padding:22px 22px 56px}
.wrap:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(115deg,transparent 0 48%,rgba(93,133,255,.045) 48.2%,transparent 49%),repeating-linear-gradient(90deg,transparent 0 90px,rgba(255,255,255,.012) 91px 92px);mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}
.top{margin-bottom:20px;padding:4px 2px}.brand{font-size:34px;letter-spacing:-.7px;text-shadow:0 0 24px rgba(120,151,255,.18);animation:logoFloat 3.2s ease-in-out infinite}.brand i{color:#D7A83F;text-shadow:0 0 18px rgba(215,168,63,.35)}
.top .btn{background:rgba(17,25,54,.72);border-color:rgba(125,155,230,.25);backdrop-filter:blur(12px);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.btn{border-radius:12px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.btn:hover{transform:translateY(-2px);border-color:rgba(215,168,63,.55);box-shadow:0 10px 24px rgba(0,0,0,.22)}

/* =========================
   CollectPro V22 — Premium Fintech Visual Layer
   UI-only changes: content, calculations, Supabase logic and payment data untouched.
   ========================= */

:root{
  --bg:#070B1D;
  --card:rgba(18,25,60,.78);
  --ink:#111A42;
  --ink2:#18255A;
  --text:#F3F5FF;
  --muted:#AEB7D8;
  --line:rgba(105,137,255,.30);
  --gold:#FFC84A;
  --paid:#20E0B2;
  --miss:#FF9D3D;
  --pend:#28345E;
  --in:rgba(13,19,48,.72);
  --violet:#8D6BFF;
  --cyan:#32B9FF;
}

html{background:#070B1D}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 18%,rgba(53,111,255,.18),transparent 28%),
    radial-gradient(circle at 88% 24%,rgba(153,75,255,.16),transparent 27%),
    radial-gradient(circle at 72% 86%,rgba(0,224,205,.09),transparent 25%),
    linear-gradient(135deg,#050817 0%,#0A1230 48%,#10154A 100%);
  color:var(--text);
  position:relative;
}
body:before,
body:after{
  content:"";
  position:fixed;
  inset:-25%;
  pointer-events:none;
  z-index:-1;
}
body:before{
  background:
    radial-gradient(ellipse at 30% 25%,transparent 0 28%,rgba(72,115,255,.10) 29%,transparent 30%),
    radial-gradient(ellipse at 72% 68%,transparent 0 26%,rgba(167,82,255,.09) 27%,transparent 28%);
  filter:blur(2px);
  animation:financeDrift 18s ease-in-out infinite alternate;
}
body:after{
  background-image:
    radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(87,185,255,.55) 0 1px,transparent 1.5px);
  background-size:170px 170px,230px 230px;
  background-position:20px 30px,100px 120px;
  opacity:.24;
  animation:starFloat 28s linear infinite;
}
@keyframes financeDrift{
  from{transform:translate3d(-2%,0,0) rotate(0deg) scale(1)}
  to{transform:translate3d(3%,-2%,0) rotate(2deg) scale(1.05)}
}
@keyframes starFloat{to{background-position:190px 0,0 240px}}

.wrap{
  max-width:1180px;
  padding:18px 22px 60px;
  position:relative;
}
.top{
  margin-bottom:20px;
  min-height:58px;
  position:relative;
}
.top:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-8px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(104,150,255,.35),rgba(184,108,255,.25),transparent);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font:500 31px/1 'Instrument Serif',Georgia,serif;
  cursor:pointer;
  color:#F7F7FF;
  text-shadow:0 0 18px rgba(111,143,255,.18);
  transition:transform .25s ease,filter .25s ease;
}
.brand:hover{transform:translateY(-2px);filter:brightness(1.12)}
.brand-word strong{
  color:#A77BFF;
  font-weight:500;
}
.brand-mark{
  width:38px;height:38px;
  position:relative;
  display:inline-flex;
  align-items:flex-end;
  justify-content:center;
  gap:3px;
  padding:7px 5px 6px;
  border-radius:11px;
  background:linear-gradient(145deg,rgba(54,156,255,.26),rgba(139,89,255,.22));
  border:1px solid rgba(116,158,255,.42);
  box-shadow:0 0 22px rgba(70,130,255,.22),inset 0 0 18px rgba(150,93,255,.10);
  animation:logoPulse 2.8s ease-in-out infinite;
}
.brand-mark b{
  width:4px;
  border-radius:5px;
  background:linear-gradient(180deg,#63D8FF,#7C67FF);
  box-shadow:0 0 7px rgba(66,191,255,.55);
}
.brand-mark b:nth-child(1){height:9px}
.brand-mark b:nth-child(2){height:16px}
.brand-mark b:nth-child(3){height:23px}
.brand-mark i{
  position:absolute;
  right:2px;top:-7px;
  color:#FFC84A;
  font:700 16px Manrope,sans-serif;
  font-style:normal;
  text-shadow:0 0 9px rgba(255,200,74,.8);
  animation:arrowRise 1.8s ease-in-out infinite;
}
@keyframes logoPulse{50%{box-shadow:0 0 30px rgba(116,91,255,.38),inset 0 0 22px rgba(83,180,255,.16)}}
@keyframes arrowRise{50%{transform:translate(2px,-2px) scale(1.08)}}

.btn{
  border:1px solid rgba(103,139,255,.34);
  background:linear-gradient(135deg,rgba(26,36,82,.88),rgba(12,18,47,.88));
  color:#F2F4FF;
  padding:10px 15px;
  border-radius:13px;
  box-shadow:inset 0 1px rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.16);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,filter .22s ease;
}
.btn:hover{
  transform:translateY(-2px);
  border-color:rgba(102,184,255,.7);
  box-shadow:0 10px 28px rgba(23,89,210,.20),0 0 18px rgba(104,108,255,.12);
}
.btn.pri{
  color:#15101F;
  border-color:#FFD45E;
  background:linear-gradient(135deg,#FFD96A,#FFB82E 55%,#FF9C31);
  box-shadow:0 8px 25px rgba(255,183,51,.25),0 0 20px rgba(255,201,74,.15);
  font-weight:800;
}
.add-nav-btn{position:relative}
.add-nav-btn:before{content:"＋";margin-right:5px;font-weight:800}
.portal-nav-btn:before{content:"⌂";margin-right:7px;color:#B58BFF}
.logout-nav-btn:before{content:"↪";margin-right:7px;color:#FF9DFF}
.logout-nav-btn{border-color:rgba(166,105,255,.38)}

.grid{gap:14px}
.stat,.sec{
  background:
    linear-gradient(145deg,rgba(26,37,83,.80),rgba(10,16,43,.78));
  border:1px solid rgba(90,130,255,.30);
  border-radius:19px;
  box-shadow:0 18px 45px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.045);
  backdrop-filter:blur(14px);
}
.stat{transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease}
.stat:hover{transform:translateY(-4px);border-color:rgba(100,160,255,.55);box-shadow:0 18px 42px rgba(23,69,170,.20)}

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 82% 50%,rgba(75,126,255,.18),transparent 25%),
    radial-gradient(circle at 72% 20%,rgba(168,78,255,.13),transparent 25%),
    linear-gradient(145deg,rgba(24,35,86,.92),rgba(8,14,39,.92));
  border:1px solid rgba(86,136,255,.45);
  box-shadow:0 24px 60px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.05);
}
.hero:before{
  content:"₹";
  position:absolute;
  right:7%;top:9%;
  font:400 150px/1 'Instrument Serif',serif;
  color:rgba(255,197,74,.055);
  transform:rotate(-8deg);
  text-shadow:0 0 35px rgba(255,197,74,.06);
  pointer-events:none;
}
.hero:after{
  content:"";
  position:absolute;
  width:46%;height:160px;
  right:-7%;bottom:-65px;
  border-top:2px solid rgba(72,175,255,.18);
  border-radius:50%;
  box-shadow:0 -20px 0 rgba(154,87,255,.10),0 -42px 0 rgba(255,197,74,.07);
  transform:rotate(-9deg);
  pointer-events:none;
  animation:heroWave 6s ease-in-out infinite alternate;
}
@keyframes heroWave{to{transform:translateY(-12px) rotate(-5deg)}}

.badge{
  border-color:rgba(32,224,178,.55)!important;
  background:rgba(20,224,178,.08)!important;
  color:#36E8BC!important;
  box-shadow:0 0 18px rgba(32,224,178,.08);
}

.cust{
  background:linear-gradient(135deg,rgba(21,32,74,.86),rgba(10,16,42,.82));
  border:1px solid rgba(85,128,255,.28);
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.cust:hover{
  transform:translateY(-3px);
  border-color:rgba(113,159,255,.58);
  box-shadow:0 15px 35px rgba(28,72,190,.20);
}
.ring{filter:drop-shadow(0 0 8px rgba(94,145,255,.18))}

.portal-page{position:relative}
.portal-page:before{
  content:"";
  position:fixed;
  width:260px;height:260px;
  right:-80px;top:18%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(130,76,255,.15),transparent 68%);
  pointer-events:none;
  animation:orbFloat 7s ease-in-out infinite;
}
@keyframes orbFloat{50%{transform:translate(-30px,25px) scale(1.1)}}

.portal-hero{
  border-radius:24px;
  box-shadow:0 26px 70px rgba(0,0,0,.32),0 0 45px rgba(71,108,255,.08),inset 0 1px rgba(255,255,255,.06);
}
.portal-hero .portal-big .n{
  text-shadow:0 0 20px rgba(255,255,255,.10);
}
.portal-hero .portal-big .n.g{
  color:#FFC84A!important;
  text-shadow:0 0 22px rgba(255,197,74,.18);
}
.portal-progress{
  box-shadow:0 0 18px rgba(255,198,73,.14);
}
.portal-progress b{
  background:linear-gradient(90deg,#FFC84A,#FFDA72,#A987FF)!important;
  box-shadow:0 0 16px rgba(255,199,73,.45);
}
.portal-stat{
  background:linear-gradient(145deg,rgba(27,42,94,.82),rgba(10,17,43,.82))!important;
  border-color:rgba(84,134,255,.34)!important;
  border-radius:18px!important;
}
.portal-section{
  background:linear-gradient(145deg,rgba(24,36,83,.82),rgba(9,15,40,.82))!important;
  border-color:rgba(90,132,255,.32)!important;
  box-shadow:0 20px 48px rgba(0,0,0,.20),inset 0 1px rgba(255,255,255,.045);
}
.ph-row{
  background:linear-gradient(135deg,rgba(32,46,99,.72),rgba(18,27,65,.76))!important;
  border-color:rgba(89,132,255,.18)!important;
}
.portal-lang{
  border-color:rgba(116,155,255,.48)!important;
  background:linear-gradient(135deg,rgba(36,49,101,.85),rgba(15,22,55,.85))!important;
}

.ph-row,.w{transition:transform .22s ease,box-shadow .22s ease}
.w:hover{transform:translateY(-3px) scale(1.04);filter:brightness(1.08)}

#ov{background:rgba(3,6,18,.74)!important;backdrop-filter:blur(8px)}
.modal{
  background:linear-gradient(145deg,#111A43,#080E2A)!important;
  border-color:rgba(93,139,255,.40)!important;
  box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 35px rgba(88,108,255,.12)!important;
}

@media(max-width:700px){
  .wrap{padding:12px 12px 42px}
  .top{align-items:flex-start;flex-direction:column;gap:12px}
  .top .row{width:100%}
  .top .row .btn{flex:1;min-width:0}
  .brand{font-size:28px}
  .brand-mark{width:35px;height:35px}
  .hero{border-radius:20px}
  .hero:before{font-size:90px;right:2%}
  .stat,.sec{border-radius:16px}
  .portal-hero{border-radius:20px}
  .portal-page:before{width:180px;height:180px;right:-80px}
}
@media(prefers-reduced-motion:reduce){
  body:before,body:after,.brand-mark,.brand-mark i,.hero:after,.portal-page:before{animation:none!important}
}


/* V23 Dashboard + classic CollectPro text logo */
.brand-word{font:400 34px 'Instrument Serif',Georgia,serif;color:#F5F6FF;letter-spacing:-.7px;text-shadow:0 0 24px rgba(120,151,255,.18)}
.brand-word i{font-style:normal;color:#B184FF;text-shadow:0 0 18px rgba(177,132,255,.28)}
.dashboard-nav-btn{border-color:rgba(83,171,255,.38)!important;background:linear-gradient(135deg,rgba(28,52,100,.82),rgba(17,24,56,.82))!important}
.dashboard-page{animation:dashIn .5s ease both}
.dashboard-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:10px 0 18px}
.dashboard-head h1{font-size:38px;margin:2px 0}.dashboard-head p{margin:0;color:var(--muted)}
.dash-kicker{font:700 11px Manrope,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#70CFFF}
.dashboard-card{position:relative;overflow:hidden}.dashboard-card:after{content:"";position:absolute;width:110px;height:110px;right:-45px;top:-45px;border-radius:50%;background:rgba(106,113,255,.10)}
.dashboard-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
.dash-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.category-list{display:grid;gap:9px;margin-top:12px}
.category-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 14px;border:1px solid rgba(104,139,230,.18);border-radius:13px;background:rgba(255,255,255,.035)}
.category-row b{display:block}.category-row small{display:block;color:var(--muted);margin-top:3px}.category-row strong{font:400 28px 'Instrument Serif',serif;color:#F6F7FF}
.snapshot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.snapshot>div{padding:13px;border:1px solid rgba(104,139,230,.18);border-radius:12px;background:rgba(255,255,255,.035)}
.snapshot span{display:block;color:var(--muted);font-size:11px}.snapshot b{display:block;margin-top:3px;font:400 22px 'Instrument Serif',serif}
.dash-live{font-size:11px;font-weight:800;color:#25E0AE;padding:6px 10px;border:1px solid rgba(37,224,174,.3);border-radius:99px;background:rgba(37,224,174,.07)}
.performance-list{display:grid;gap:7px;margin-top:12px}
.performance-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto 16px;align-items:center;gap:10px;padding:10px 8px;border:1px solid transparent;border-radius:13px;cursor:pointer;transition:.2s ease}
.performance-row:hover{background:rgba(65,99,190,.10);border-color:rgba(101,142,255,.22);transform:translateY(-1px)}
.perf-avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#3158B7,#8B61E9);font-weight:800;box-shadow:0 0 16px rgba(89,105,236,.18)}
.perf-main{min-width:0}.perf-main b{display:block}.perf-main small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.perf-cat{font-size:10.5px;font-weight:800;padding:6px 9px;border-radius:99px;white-space:nowrap}
.perf-cat.prime{color:#39E2B4;background:rgba(32,224,178,.10);border:1px solid rgba(32,224,178,.25)}
.perf-cat.standard{color:#FFD66B;background:rgba(255,198,72,.10);border:1px solid rgba(255,198,72,.25)}
.perf-cat.risk{color:#FF9B5A;background:rgba(255,137,66,.10);border:1px solid rgba(255,137,66,.25)}
.perf-cat.completed{color:#9CA9D5;background:rgba(150,165,210,.10);border:1px solid rgba(150,165,210,.25)}
.perf-cat.healthy{color:#72C8FF;background:rgba(72,170,255,.10);border:1px solid rgba(72,170,255,.25)}

  d.setDate(d.getDate()+delta+((Number(weekNo)-1)*7));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function trackerItems(c){
 var base=[],i;
 for(i=1;i<=c.weeks;i++)base.push({week:i,status:"upcoming"});
 c.pays.forEach(function(p){
   if(p.week>=1&&p.week<=c.weeks){
     if(p.type==="paid"||p.type==="hist")base[p.week-1].status="paid";
     else if(p.type==="unpaid"&&base[p.week-1].status!=="paid")base[p.week-1].status="unpaid";
   }
 });
 /* Carry-over weeks are released one-at-a-time. If Week 13 is unpaid,
    Week 14 is not added. Once Week 13 is paid, Week 14 can appear when
    its real collection date arrives. */
 var debt=base.filter(function(x){return x.status==="unpaid"});
 if(debt.length){
   var cw=c.weeks+1,weekday=(c.collectionWeekday==null?4:+c.collectionWeekday);
   for(var guard=0;guard<20;guard++,cw++){
     var due=nextWeekDate(c.date,cw,weekday);
     var today=new Date();today.setHours(0,0,0,0);
     var dueDate=due?new Date(due+"T00:00:00"):null;
     if(dueDate && dueDate>today)break;
     var cp=c.pays.filter(function(p){return +p.week===cw});
     var paid=cp.some(function(p){return p.type==="paid"||p.type==="hist"});
     base.push({week:cw,status:paid?"paid":"carry"});
     if(!paid)break;
   }
 }
 return base;
}
function strip(c){return trackerItems(c).map(function(x){return x.status==="paid"?"p":(x.status==="unpaid"||x.status==="carry")?"m":""});}

 if(k.done)return null;
 var paidWeeks=Math.max(0,Number(k.paidW)||0);

 var candidate=Math.min(Math.max(paidWeeks+missWeeks+1,1),Math.max(Number(c.weeks)||1,1));
 var d=nextWeekDate(c.date,candidate,weekday);
 if(!d)return null;

}

}

function paymentRows(c){
  return c.pays.map(function(p,i){return {p:p,i:i}}).sort(function(a,b){
    var d=String(b.p.date||"").localeCompare(String(a.p.date||""));
    return d!==0?d:b.i-a.i;
  }).map(function(x){return x.p});
}
function paymentDay(s){
  if(!s)return "";
  var d=new Date(s+"T00:00:00");
  return Number.isNaN(d.getTime())?"":d.toLocaleDateString("en-IN",{weekday:"short"});
}
function paymentRowHtml(c,p,adminMode){
  var u=p.type==="unpaid";
  var status=u?pt("unpaid"):(p.type==="hist"?pt("historical"):pt("paid"));
  var statusClass=u?"unpaid":"";
  var action=adminMode ? " onclick=\"payForm('"+c.id+"','"+(p.id||"")+"')\"" : "";
  var weekLabel=portalLang==="te"?("వారం "+esc(p.week)):("W"+esc(p.week));
  return '<div class="ph-row"'+action+'>'+
    '<div class="ph-date">'+fmt(p.date)+'<small>'+paymentDay(p.date)+'</small></div>'+
    '<div class="ph-week">'+weekLabel+'</div>'+
    '<div class="ph-status '+statusClass+'"><span class="ph-dot"></span>'+status+'</div>'+
    '<div class="ph-amount">'+(u?inr(0):inr(p.amt))+'</div>'+
    '<div class="ph-arrow">›</div>'+
  '</div>';
}
function paymentHistoryHtml(c,adminMode){
  var rows=paymentRows(c),recent=rows.slice(0,5);
  return '<div class="sec '+(adminMode?"":"portal-history")+'">'+
    '<div class="ph-head"><div><h2>'+pt("history")+'</h2><p style="margin-bottom:0">'+(adminMode?"Recent collections. Tap a row to edit.":pt("recent"))+'</p></div>'+
    '<span class="ph-count">'+rows.length+' '+(rows.length===1?pt("entry"):pt("entries"))+'</span></div>'+
    (recent.length?'<div class="ph-list">'+recent.map(function(p){return paymentRowHtml(c,p,adminMode)}).join("")+'</div>':'<div class="ph-empty">No payment rows yet.</div>')+
    (rows.length>5?'<button class="ph-view" onclick="viewAllPayments(\''+c.id+'\','+(adminMode?'true':'false')+')">'+pt("viewAll")+' <span class="arr">›</span></button>':'')+
    '</div>';
}
function viewAllPayments(cid,adminMode){
  var c=null;
  if(portalData && portalData.id===cid)c=portalData;
  if(!c)c=DB.filter(function(x){return x.id===cid})[0];
  if(!c)return;
  var rows=paymentRows(c);
  var body=rows.length?'<div class="ph-list">'+rows.map(function(p){return paymentRowHtml(c,p,adminMode)}).join("")+'</div>':'<div class="ph-empty">No payment rows yet.</div>';
  open_('<div class="row"><div><h2>'+pt("allPayments")+'</h2><p style="color:var(--muted);font-size:13px;margin:4px 0 0">'+esc(c.name)+' · '+rows.length+' '+(rows.length===1?pt("entry"):pt("entries"))+'</p></div><button class="btn sm sp" onclick="close_()">'+pt("close")+'</button></div><div style="margin-top:14px">'+body+'</div>');
}


function backup(){open_('<h2>Backup &amp; restore</h2><p style="color:var(--muted);font-size:13px;margin:6px 0 12px">Copy this text and keep it safe (Notes, WhatsApp to yourself). To move data to another device, paste it here and tap Restore. Restore replaces current data.</p><textarea id="bk" rows="7" onfocus="this.select()">'+esc(JSON.stringify(DB))+'</textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="close_()">Close</button><button class="btn pri sp" onclick="restore()">Restore from text</button></div><div id="err" style="color:var(--miss);margin-top:8px"></div>')}
function restore(){try{var d=JSON.parse($("bk").value);if(!Array.isArray(d)||d.some(function(c){return !c.id||!c.name||!Array.isArray(c.pays)}))throw 0;DB=d;save();close_();go("")}catch(e){$("err").textContent="This text is not a valid CollectPro backup."}}

function selDay(id,label,v){
  var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  v=(v==null?4:+v);
  return '<div><label>'+label+'<select id="'+id+'">'+days.map(function(d,i){return '<option value="'+i+'"'+(i===v?' selected':'')+'>'+d+'</option>'}).join("")+'</select></label></div>';
}

async function saveC(id){
 var g=function(i){return $(i).value.trim()};
 var o={name:g("f_name"),customerId:g("f_cid"),phone:g("f_phone"),loan:+g("f_loan"),perWeek:+g("f_pw"),weeks:+g("f_wk"),date:g("f_date"),collectionWeekday:(id?((DB.filter(function(x){return x.id===id})[0].collectionWeekday==null)?4:+DB.filter(function(x){return x.id===id})[0].collectionWeekday):4),hPaid:+g("f_hp")||0,hMiss:+g("f_hm")||0,hAmt:g("f_ha")};
 var pin=g("f_pin");
 var e=!o.name?"Enter the customer name.":!o.customerId?"Enter a Customer ID.":(!id&&!pin)?"Set a PIN for this customer.":!(o.perWeek>0)?"Enter the per week amount.":!(o.weeks>0)?"Enter the total payable weeks.":(o.hPaid+o.hMiss>o.weeks)?"Paid + missed weeks cannot exceed total weeks.":"";
 if(e){$("err").textContent=e;return}
 if(id){var c=DB.filter(function(x){return x.id===id})[0];for(var k in o)c[k]=o[k];if(pin)c._newPin=pin}
 else{o.id=null;o.pays=[];o._newPin=pin;DB.push(o)}
 if(sb){var c2=id?DB.filter(function(x){return x.id===id})[0]:DB[DB.length-1];var ok=await cloudSaveCustomer(c2,pin||null);if(!ok)return;await cloudLoad();var match=DB.filter(function(x){return x.customerId.toLowerCase()===o.customerId.toLowerCase()})[0];if(match)id=match.id}
 save();close_();go(id||"");
}
function payForm(cid,pid){
 var c=DB.filter(function(x){return x.id===cid})[0],p=pid?c.pays.filter(function(x){return x.id===pid})[0]:null;

 p=p||{date:nextWeekDate(c.date,Math.min(nx,c.weeks),c.collectionWeekday==null?4:+c.collectionWeekday)||new Date().toISOString().slice(0,10),amt:c.perWeek,mode:"Cash",week:Math.min(nx,c.weeks),type:"paid"};
 var sel=function(id,l,opts,v){return '<div><label>'+l+'<select id="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></label></div>'};

 '<div class="full">'+sel("p_type","Payment type",[["paid","Paid week"],["unpaid","Unpaid (missed week)"],["hist","Historical paid week"]],p.type)+'</div>'+
 '<div class="note full">Unpaid weeks are saved as ₹0 and shown in red. Historical rows add dates to weeks already counted in setup, so they are not counted twice.</div></div>'+
 '<div class="row"><button class="btn" onclick="close_()">Cancel</button><button class="btn pri sp" onclick="saveP(\''+cid+'\',\''+(pid||"")+'\')">Save payment</button></div><div id="err" style="color:var(--miss);margin-top:8px"></div>');
 var tp=function(){var u=$("p_type").value==="unpaid";$("p_amt").disabled=u;if(u)$("p_amt").value=0;else if(+$("p_amt").value===0)$("p_amt").value=c.perWeek};$("p_type").onchange=tp;tp();
}
async function saveP(cid,pid){
 var c=DB.filter(function(x){return x.id===cid})[0];
 var o={date:$("p_date").value,amt:+$("p_amt").value,mode:$("p_mode").value,week:+$("p_wk").value,type:$("p_type").value};
 var maxWeek=trackerItems(c).length;if(!o.date||!(o.amt>=0)||!(o.week>=1&&o.week<=maxWeek)){$("err").textContent="Enter a date, amount and a week between 1 and "+maxWeek+".";return}
 if(pid){var p=c.pays.filter(function(x){return x.id===pid})[0];for(var k in o)p[k]=o[k]}else{o.id=uid();c.pays.push(o)}
 if(sb){var ok=await cloudSaveCustomer(c,null);if(!ok)return;await cloudLoad()}else save();close_();render();
}
function arm(key,b){if(armed===key)return true;armed=key;var t=b.textContent;b.textContent="Tap again";setTimeout(function(){if(armed===key){armed=null;b.textContent=t}},3000);return false}
async function delP(cid,pid,b){if(!arm(pid,b))return;var c=DB.filter(function(x){return x.id===cid})[0];c.pays=c.pays.filter(function(x){return x.id!==pid});if(sb){var ok=await cloudSaveCustomer(c,null);if(!ok)return;await cloudLoad()}else save();armed=null;render()}
async function delC(cid,b){if(!arm(cid,b))return;if(sb){var ok=await cloudDelete(cid);if(!ok)return}DB=DB.filter(function(x){return x.id!==cid});save();go("")}
